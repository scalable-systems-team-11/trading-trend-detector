services:
  receiver:
    build: ./receiver
    environment:
      RECEIVER_PORT: "9999"
      RECEIVER_PRINT_EVERY: "10000"

  replayer:
    build: ./replayer
    depends_on:
      - receiver
    volumes:
      # CSV files are not baked into the image; put them in ./data on the host.
      - ./data:/data:ro
    environment:
      REPLAY_FILES: /data/debs2022-gc-trading-day-08-11-21.csv
      REPLAY_SPEED: "60"
      REPLAY_ONLY_PRICES: "1"
      REPLAY_START: "08:00"
      REPLAY_SINK: tcp
      REPLAY_TCP_HOST: receiver
      REPLAY_TCP_PORT: "9999"
