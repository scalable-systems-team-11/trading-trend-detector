services:
  receiver:
    build: ./receiver
    environment:
      RECEIVER_PORT: "9999"
      RECEIVER_PRINT_EVERY: "10000"
      RECEIVER_ALLOWED_LATENESS_SECONDS: "${RECEIVER_ALLOWED_LATENESS_SECONDS:-0}"
      RECEIVER_OUTPUT: /output  # one windows-<UTC time>.jsonl per run
      RECEIVER_FLUSH_PARTIAL: "${RECEIVER_FLUSH_PARTIAL:-0}"
      RECEIVER_SYMBOLS: "${RECEIVER_SYMBOLS:-}"
      RECEIVER_BENCH_OUTPUT: /benchmarks  # one <UTC time>-<kind>-<label>.json per run
      RECEIVER_BENCH_LABEL: "${BENCH_LABEL:-}"
    volumes:
      - ./output:/output
      - ./results/benchmarks:/benchmarks

  replayer:
    build: ./replayer
    depends_on:
      - receiver
    volumes:
      # CSV files are not baked into the image; put them in ./data on the host.
      - ./data:/data:ro
    environment:
      # Override any of these in .env (see .env.example).
      REPLAY_FILES: "${REPLAY_FILES:-/data/debs2022-gc-trading-day-08-11-21.csv}"
      REPLAY_SPEED: "${REPLAY_SPEED:-60}"
      REPLAY_ONLY_PRICES: "${REPLAY_ONLY_PRICES:-1}"
      REPLAY_START: "${REPLAY_START-08:00}"
      REPLAY_END: "${REPLAY_END:-}"
      REPLAY_SYMBOLS: "${REPLAY_SYMBOLS:-}"
      REPLAY_LIMIT: "${REPLAY_LIMIT:-0}"
      REPLAY_SINK: tcp
      REPLAY_TCP_HOST: receiver
      REPLAY_TCP_PORT: "9999"

  # ---- Kafka pipeline: docker compose --profile kafka up --build ----
  # Replayer -> topic (keyed by symbol) -> N worker processes, each owning a
  # partition (KAFKA_WORKERS sets both). The TCP receiver/replayer above stay the baseline.
  # ---- Flink pipeline: docker compose --profile flink up --build ----
  # Same broker and producer; the PyFlink job reads the finished topic instead of the workers.
  # KAFKA_PARTITIONS (default KAFKA_WORKERS) sets the partition count, FLINK_PARALLELISM the
  # parallelism of the window operator (default: one per partition).

  kafka:
    profiles: [kafka, flink]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka-init:
    profiles: [kafka, flink]
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic ${KAFKA_TOPIC:-ticks} --partitions ${KAFKA_PARTITIONS:-${KAFKA_WORKERS:-4}} --replication-factor 1

  worker:
    profiles: [kafka]
    build: ./receiver
    entrypoint: ["python", "-m", "receiver.kafka_worker"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: "${KAFKA_TOPIC:-ticks}"
      KAFKA_WORKERS: "${KAFKA_WORKERS:-4}"
      RECEIVER_PRINT_EVERY: "100000"
      RECEIVER_ALLOWED_LATENESS_SECONDS: "${RECEIVER_ALLOWED_LATENESS_SECONDS:-0}"
      RECEIVER_OUTPUT: /output  # kafka-windows-<UTC time>.w<i>.jsonl per run
      RECEIVER_FLUSH_PARTIAL: "${RECEIVER_FLUSH_PARTIAL:-0}"
      RECEIVER_SYMBOLS: "${RECEIVER_SYMBOLS:-}"
      RECEIVER_BENCH_OUTPUT: /benchmarks  # one <UTC time>-<kind>-<label>.json per run
      RECEIVER_BENCH_LABEL: "${BENCH_LABEL:-}"
    volumes:
      - ./output:/output
      - ./results/benchmarks:/benchmarks

  producer:
    profiles: [kafka, flink]
    build: ./replayer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
    environment:
      REPLAY_FILES: "${REPLAY_FILES:-/data/debs2022-gc-trading-day-08-11-21.csv}"
      REPLAY_SPEED: "${REPLAY_SPEED:-0}"
      REPLAY_ONLY_PRICES: "${REPLAY_ONLY_PRICES:-1}"
      REPLAY_START: "${REPLAY_START-08:00}"
      REPLAY_END: "${REPLAY_END:-}"
      REPLAY_SYMBOLS: "${REPLAY_SYMBOLS:-}"
      REPLAY_LIMIT: "${REPLAY_LIMIT:-0}"
      REPLAY_SINK: kafka
      REPLAY_KAFKA_BOOTSTRAP: kafka:9092
      REPLAY_KAFKA_TOPIC: "${KAFKA_TOPIC:-ticks}"

  flink:
    profiles: [flink]
    build:
      context: .
      dockerfile: flink/Dockerfile
    depends_on:
      producer:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: "${KAFKA_TOPIC:-ticks}"
      FLINK_PARALLELISM: "${FLINK_PARALLELISM:-0}"
      FLINK_CONF: "${FLINK_CONF:-}"
      RECEIVER_ALLOWED_LATENESS_SECONDS: "${RECEIVER_ALLOWED_LATENESS_SECONDS:-0}"
      RECEIVER_OUTPUT: /output  # flink-windows-<UTC time>.w<i>.jsonl per run
      RECEIVER_FLUSH_PARTIAL: "${RECEIVER_FLUSH_PARTIAL:-0}"
      RECEIVER_SYMBOLS: "${RECEIVER_SYMBOLS:-}"
      RECEIVER_BENCH_OUTPUT: /benchmarks  # one <UTC time>-<kind>-<label>.json per run
      RECEIVER_BENCH_LABEL: "${BENCH_LABEL:-}"
    volumes:
      - ./output:/output
      - ./results/benchmarks:/benchmarks
